<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StumbleScience</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="intro-body">

  <!-- Animated Scientific Network Canvas + Ambient Glow -->
  <canvas id="bg-canvas" aria-hidden="true"></canvas>
  <div class="bg-glow" aria-hidden="true"></div>

  <!-- Top-Right Theme Switcher -->
  <header class="intro-header">
    <div class="theme-switcher">
      <button class="theme-btn" data-set-theme="light">Light</button>
      <button class="theme-btn" data-set-theme="dark">Dark</button>
      <button class="theme-btn" data-set-theme="sepia">Sepia</button>
    </div>
  </header>

  <!-- Centered Main Intro Content -->
  <main class="intro-main">
    <div class="intro-hero">
      <div class="atom-badge" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="2"></circle>
          <path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49m11.31-2.82a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14"></path>
        </svg>
      </div>
      <h1 class="intro-title">StumbleScience</h1>
    </div>

    <div class="selector-panel">
      <div id="topic-container" class="topic-list"></div>

      <div class="launch-area">
        <button id="stumble-launch" class="stumble-big-btn">
          <span>Stumble</span>
          <svg class="btn-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14"></path>
            <path d="m12 5 7 7-7 7"></path>
          </svg>
        </button>
      </div>
    </div>
  </main>

  <script src="data.js"></script>
  <script>
    // --- Theme Setup ---
    const savedTheme = localStorage.getItem('stumblescience-theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    const themeBtns = document.querySelectorAll('.theme-btn');

    function syncTheme(theme) {
      themeBtns.forEach(btn => btn.classList.toggle('active', btn.dataset.setTheme === theme));
    }
    syncTheme(savedTheme);

    themeBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const theme = btn.dataset.setTheme;
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('stumblescience-theme', theme);
        syncTheme(theme);
      });
    });

    // --- Render Topics with Live Counts ---
    const topicContainer = document.getElementById('topic-container');
    let selectedTopic = 'All';
    const topics = ['All', ...Object.keys(SITE_DATA)];
    const totalCount = Object.values(SITE_DATA).flat().length;

    function getCount(topic) {
      return topic === 'All' ? totalCount : (SITE_DATA[topic]?.length || 0);
    }

    function renderTopics() {
      topicContainer.innerHTML = '';
      topics.forEach(topic => {
        const btn = document.createElement('button');
        btn.className = 'topic-pill' + (topic === selectedTopic ? ' active' : '');

        const label = document.createElement('span');
        label.textContent = topic;

        const badge = document.createElement('span');
        badge.className = 'topic-count';
        badge.textContent = getCount(topic);

        btn.appendChild(label);
        btn.appendChild(badge);

        btn.onclick = () => {
          selectedTopic = topic;
          renderTopics();
        };
        topicContainer.appendChild(btn);
      });
    }
    renderTopics();

    // --- Launch Stumble Window ---
    function launchStumble() {
      window.open(`stumble.html?topic=${encodeURIComponent(selectedTopic)}`, '_blank');
    }
    document.getElementById('stumble-launch').addEventListener('click', launchStumble);

    // --- Background Network / Molecular Graph Animation ---
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    const mouse = { x: null, y: null };

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });
    window.addEventListener('mouseleave', () => {
      mouse.x = null;
      mouse.y = null;
    });

    const count = Math.min(65, Math.floor((window.innerWidth * window.innerHeight) / 18000));
    for (let i = 0; i < count; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        vx: (Math.random() - 0.5) * 0.55,
        vy: (Math.random() - 0.5) * 0.55,
        r: Math.random() * 1.8 + 1.2
      });
    }

    function getThemeParticleColors() {
      const theme = document.documentElement.getAttribute('data-theme');
      if (theme === 'light') return { dot: 'rgba(37, 99, 235, 0.45)', line: '37, 99, 235' };
      if (theme === 'sepia') return { dot: 'rgba(180, 83, 9, 0.4)', line: '180, 83, 9' };
      return { dot: 'rgba(59, 130, 246, 0.5)', line: '59, 130, 246' };
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const colors = getThemeParticleColors();

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;

        if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = colors.dot;
        ctx.fill();

        // Connect nearby nodes
        for (let j = i + 1; j < particles.length; j++) {
          const p2 = particles[j];
          const dx = p.x - p2.x;
          const dy = p.y - p2.y;
          const dist = Math.hypot(dx, dy);

          if (dist < 135) {
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.strokeStyle = `rgba(${colors.line}, ${0.22 * (1 - dist / 135)})`;
            ctx.lineWidth = 1;
            ctx.stroke();
          }
        }

        // Connect to cursor
        if (mouse.x !== null) {
          const dx = p.x - mouse.x;
          const dy = p.y - mouse.y;
          const dist = Math.hypot(dx, dy);
          if (dist < 160) {
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(mouse.x, mouse.y);
            ctx.strokeStyle = `rgba(${colors.line}, ${0.35 * (1 - dist / 160)})`;
            ctx.lineWidth = 1.2;
            ctx.stroke();
          }
        }
      }
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
